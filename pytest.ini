[pytest]
testpaths = tests
# Per-test budget (issue #119): a test that runs longer than 60 seconds fails fast
# instead of blocking the run. The signal method interrupts the stuck test on
# macOS/Linux; use `-o timeout_method=thread` on platforms without SIGALRM.
timeout = 60
timeout_method = signal
log_cli = true
log_cli_level = DEBUG
