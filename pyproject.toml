[project]
name = "trader"
version = "0.50.3"
description = "Awesome trader created by socoldlight"
authors = [
    {name = "socoldlight", email = "socoldlight@example.com"},
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "backtrader",
    "matplotlib",
    "prettytable",
    "python-dotenv",
    "fastapi[standard]",
    "pymongo",
    "statsmodels",
    "binance-common>=1.0.0",
    "binance-sdk-spot>=1.0.0",
    "fastapi-auto-router>=0.1.1",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "ruff",
    "mkdocs",
    "httpx"
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
trader = "trader.app.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
trader = [
    "VERSION",
    "data/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 150
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 150
target-version = "py312"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # 基础错误 + 格式 + import 排序
