{% extends "base.html" %}

{% block title %}修改密码{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">修改密码</h5>
            </div>
            <div class="card-body">
                {% if user and user.must_change_password %}
                <div class="alert alert-warning">当前账户需要先修改密码。</div>
                {% endif %}
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="post" action="/change-password">
                    <div class="mb-3">
                        <label class="form-label" for="password">新密码</label>
                        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
                        <div class="form-text">至少 10 位，包含字母和数字，不能等于用户名。</div>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">更新密码</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
